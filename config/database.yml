# Everything, including Solid Queue/Cache/Cable, lives in one SQLite file per
# environment under storage/, which is the volume mounted in production.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/<%= ENV.fetch("DEV_DATABASE", "development") %>.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3
